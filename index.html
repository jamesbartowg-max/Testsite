<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lunchly</title>
  <meta name="description" content="Lunchly – Tinder fürs Mittagessen von morgen. Jeden Tag 15 Gerichte aus 150 auf dem eigenen Handy swipen. Was beide wollen, gibt es morgen. Mit Histamin-Barometer bei jedem Gericht.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preload" href="fonts/DMSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("booting"); try { if (localStorage.getItem("lunchly.theme") === "dark") document.documentElement.classList.add("dark-mode"); } catch (e) {}</script>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <svg class="splash-mark" viewBox="0 0 64 64">
      <g class="steam" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
        <path class="s1" d="M22 8 C 18 13, 26 17, 22 23">
          <animate attributeName="d" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"
            values="M22 8 C 18 13, 26 17, 22 23; M22 8 C 26 13, 18 17, 22 23; M22 8 C 18 13, 26 17, 22 23"/>
        </path>
        <path class="s2" d="M32 5 C 28 10, 36 14, 32 20">
          <animate attributeName="d" dur="1.4s" begin="-0.45s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"
            values="M32 5 C 28 10, 36 14, 32 20; M32 5 C 36 10, 28 14, 32 20; M32 5 C 28 10, 36 14, 32 20"/>
        </path>
        <path class="s3" d="M42 8 C 38 13, 46 17, 42 23">
          <animate attributeName="d" dur="1.4s" begin="-0.9s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"
            values="M42 8 C 38 13, 46 17, 42 23; M42 8 C 46 13, 38 17, 42 23; M42 8 C 38 13, 46 17, 42 23"/>
        </path>
      </g>
      <path d="M8 30 h48 a24 24 0 0 1 -48 0 z" fill="currentColor"/>
    </svg>
    <span class="splash-word">lunchly</span>
    <span class="splash-sub">Was essen wir morgen?</span>
  </div>
  <div id="app" class="app" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/data/dishes-deutschland.js"></script>
  <script src="js/data/dishes-europa.js"></script>
  <script src="js/data/dishes-international.js"></script>
  <script src="js/data/desserts.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
